{{- if (((.Values.api).serviceAccount).create) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  # SPDX-FileCopyrightText: 2025 SAP SE and IPv6 Web Resource Checker contributors
  # SPDX-License-Identifier: Apache-2.0
  name: {{ include "webres6.serviceAccountName" . }}
  labels:
    {{- include "webres6.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.api.serviceAccount.annotations | default dict) }}
  {{- with .Values.api.awsRoleARN }}
  {{- $_ := set $annotations "eks.amazonaws.com/role-arn" . }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
