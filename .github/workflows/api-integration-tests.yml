name: API Integration Tests

# Live-browser integration tests: launch a real headless Chrome, crawl a real URL
# and assert on the captured Happy Eyeballs net-log. These need network and a
# browser, unlike the mocked unit suite in api-tests.yml.
#
# NOTE: GitHub-hosted runners are IPv4-only, so this job exercises the full crawl
# plumbing (netlog capture, HTTP_STREAM_POOL events, per-host happy_eyeballs
# summary) and the IPv4/TCP path, but NOT real IPv6 / dual-stack HEv3 racing
# (ipv6_succeeded stays False here). For genuine IPv6 coverage, run the suite on
# an IPv6-capable host with `WEBRES6_INTEGRATION=1`.

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-integration-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-integration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.14-${{ hashFiles('api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.14-

      - name: Install dependencies
        # unbound/pyunbound is not needed: the integration tests drive Selenium
        # (init_webdriver -> crawl_page -> get_hostinfo) and never call dnsprobe.
        run: |
          cd api
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Show Chrome version
        # ubuntu-latest ships Google Chrome stable; Selenium Manager resolves the
        # matching chromedriver automatically at runtime.
        run: google-chrome --version || google-chrome-stable --version

      - name: Run live integration tests
        env:
          WEBRES6_INTEGRATION: '1'
          # headless is the default in the tests; make it explicit for CI
          HEADLESS_SELENIUM: '1'
        run: |
          cd api
          pytest test_webres6_integration.py -v
